<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }
        main{
              
            height: 600px;
            display: flex;
            flex-direction: row;
            width: 1000px;
            box-sizing: border-box;
            border: 2px solid rgb(4, 6, 4);
            padding:80px;
            margin:0 auto;
            gap:20px;
        }
        .container{
             
            flex-grow: 1;
            height: 300px;
            box-shadow:1px 1px 5px #999 ;
            background-color: bisque;
            border: 2px solid rgb(84, 84, 84);
             
        }
        h4{
            text-align: center;
            width: 100px;
            height: 100px;
            color: rgb(189, 90, 14);
            border-radius: 45%;
            background-color: cornflowerblue; 
             margin:auto;
        }
        h5{
            text-align: center;
            margin-top: 30px;
            
        }
        p{
            text-align: center;
            line-height: 20px;

        }
    </style>

</head>

<body>
    <main>
        <div class="container">
            <div><h4>PC</h4></div>
            <h5>Piyush Chauhan</h5>
            <p>Roll No.-2503211000234</p>
            <p>1st Year(odd sem)</p>
        </div>

        <div class="container">
            <div><h4>HR</h4></div>
            <h5>Harsh Rajpoot</h5>
            <p>Roll No.-2503212000267</p>
            <p>2nd Year(odd sem)</p>

        <div class="container">
            <div><h4>VC</h4></div>
            <h5>Raj Chaudhary</h5>

            <p>1st Year(odd sem)</p>
        </div>

</body>

</html>
